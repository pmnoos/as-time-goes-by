{% extends "base.html" %}
{% block title %}New Post — My Blog{% endblock %}

{% block content %}
<div class="form-page">
    <h1>New Post</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="/posts/new" enctype="multipart/form-data" id="post-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="Your post title">
        </div>

        <div class="form-group">
            <label>Content</label>
            <div id="quill-toolbar">
                <span class="ql-formats">
                    <select class="ql-header"><option value="1"></option><option value="2"></option><option value="3"></option><option selected></option></select>
                    <button type="button" class="ql-bold"></button><button type="button" class="ql-italic"></button><button type="button" class="ql-underline"></button><button type="button" class="ql-strike"></button>
                </span>
                <span class="ql-formats">
                    <button type="button" class="ql-list" value="ordered"></button><button type="button" class="ql-list" value="bullet"></button>
                    <button type="button" class="ql-blockquote"></button><button type="button" class="ql-code-block"></button>
                </span>
                <span class="ql-formats">
                    <button type="button" class="ql-link"></button><button type="button" class="ql-image"></button><button type="button" class="ql-video"></button>
                    <select class="ql-color"></select><select class="ql-background"></select><select class="ql-align"></select>
                </span>
                <span class="ql-formats">
                    <button type="button" class="ql-insertTable">Table</button><button type="button" class="ql-clean"></button>
                </span>
            </div>
            <div id="quill-editor"></div>
            <input type="hidden" name="body" id="body">
        </div>


        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                {% for value, label in CATEGORIES %}
                <option value="{{ value }}" {% if value == 'community-life' %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Tags</label>
            {% if available_tags %}
            <div class="tag-select-box">
                <input type="text" id="tag-search" placeholder="Search existing tags..." class="tag-search-input" onkeyup="filterTags()">
                <div class="tag-select-list">
                    {% for tag in available_tags %}
                    <label class="tag-option">
                        <input type="checkbox" name="selected_tags" value="{{ tag.name }}">
                        <span>{{ tag.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            {% else %}
            <p class="hint">No tags yet. Add a new one below.</p>
            {% endif %}
            <label for="new_tags" class="hint" style="margin-top: 0.5rem; display: block;">Add new tag(s) if needed (comma separated)</label>
            <input type="text" id="new_tags" name="new_tags" placeholder="retirement, travel, finance">
        </div>


        <div class="form-group">
            <label for="cover_image">Cover image <span class="hint">(optional)</span></label>
            <input type="file" id="cover_image" name="cover_image" accept="image/*">
        </div>
        <div class="form-group">
            <label for="cover_caption">Image caption <span class="hint">(optional)</span></label>
            <input type="text" id="cover_caption" name="cover_caption" maxlength="300" placeholder="Write a caption for your image (optional)">
        </div>

        <button type="submit" class="btn">Publish post</button>
    </form>
</div>

<!-- Quill Editor -->
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<link href="/static/css/quill-better-table.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill-better-table@1.2.10/dist/quill-better-table.min.js"></script>
<script>
function filterTags() {
    const query = (document.getElementById('tag-search')?.value || '').toLowerCase();
    const options = document.querySelectorAll('.tag-option');
    options.forEach(opt => {
        const text = opt.textContent.toLowerCase();
        opt.style.display = text.includes(query) ? 'inline-flex' : 'none';
    });
}

document.addEventListener('DOMContentLoaded', function() {
    Quill.register({ 'modules/better-table': quillBetterTable }, true);

    const quill = new Quill('#quill-editor', {
        theme: 'snow',
        placeholder: 'Write your post here...',
        modules: {
            table: false,
            'better-table': {},
            keyboard: {
                bindings: quillBetterTable.keyboardBindings
            },
            toolbar: '#quill-toolbar'
        }
    });

    quill.getModule('toolbar').addHandler('insertTable', function() {
        quill.getModule('better-table').insertTable(3, 3);
    });

    document.getElementById('post-form').addEventListener('submit', function(e) {
        document.getElementById('body').value = quill.root.innerHTML;
    });
});
</script>
{% endblock %}
